<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — لوحة تحكم مكتب أبونا</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5efe6 0%, #e8dccb 100%);
    }

    [data-theme="night"] body {
      background: linear-gradient(135deg, #0f141c 0%, #1a2234 100%);
    }

    .login-card {
      background: var(--panel-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .login-header {
      text-align: center;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--gold), #92400e);
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 20px rgba(180, 83, 9, 0.3);
    }

    .login-header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .login-header p {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .login-alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .login-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #ef4444;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .demo-credentials {
      background: rgba(217, 119, 6, 0.1);
      border: 1px dashed var(--gold);
      padding: 12px;
      border-radius: 12px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.5;
    }

    .back-to-site {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
    }

    .back-to-site:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">✝</div>
      <h1>لوحة تحكم مكتب أبونا</h1>
      <p>تسجيل دخول المشرف لإدارة محتويات المشهد 3D</p>
    </div>

    <div id="login-alert" class="login-alert"></div>

    <div class="demo-credentials">
      🔑 <strong>كلمة المرور الافتراضية للوحة التحكم:</strong><br />
      <code>admin123</code>
    </div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label>كلمة المرور السرية</label>
        <input type="password" id="password" class="form-input" value="admin123" required placeholder="أدخل كلمة المرور..." autofocus />
      </div>

      <button type="submit" id="submit-btn" class="submit-btn" style="margin-top: 8px;">
        <span>دخول للوحة التحكم</span> 🚀
      </button>
    </form>

    <a href="/" class="back-to-site">← العودة إلى المشهد 3D التفاعلي</a>
  </div>

  <script>
    // Check if token already exists
    const token = localStorage.getItem('office_admin_token');
    if (token) {
      window.location.href = '/admin';
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'login-alert';
      alertBox.style.display = 'none';

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'جاري التحقق... ⏳';

      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('office_admin_token', data.token);
          localStorage.setItem('office_admin_user', JSON.stringify(data.user));
          window.location.href = '/admin';
        } else {
          alertBox.className = 'login-alert error';
          alertBox.textContent = data.error || 'فشل تسجيل الدخول';
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'تسجيل الدخول 🚀';
        }
      } catch (err) {
        alertBox.className = 'login-alert error';
        alertBox.textContent = 'تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً';
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'تسجيل الدخول 🚀';
      }
    });
  </script>
</body>
</html>
